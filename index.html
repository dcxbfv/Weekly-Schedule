                <p id="b2">روز را وارد کنید</p>
                <p id="b3">روز را وارد کنید</p>
            </div>

                <p id="name">❤️ علی اصغریان</p>
                <p id="tav">ساخته شده توسط</p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
